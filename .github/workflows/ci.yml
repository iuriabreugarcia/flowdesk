name: FlowDesk CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: flowdesk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API
        run: dotnet restore backend/FlowDesk.Api/FlowDesk.Api.csproj

      - name: Restore tests
        run: dotnet restore backend/FlowDesk.Api.Tests/FlowDesk.Api.Tests.csproj

      - name: Build
        run: dotnet build backend/FlowDesk.Api.Tests/FlowDesk.Api.Tests.csproj -c Release --no-restore

      - name: Test
        run: dotnet test backend/FlowDesk.Api.Tests/FlowDesk.Api.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

  frontend:
    name: Frontend · tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/flowdesk-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test -- --no-progress

      - name: Production build
        run: npm run build

  containers:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t flowdesk-api:ci backend/FlowDesk.Api

      - name: Build web image
        run: docker build -t flowdesk-web:ci frontend/flowdesk-web
